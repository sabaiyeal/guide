kind = "web"
previewPath = "/"
title = "Toobtubb Guide"
version = "1.0.0"
id = "artifacts/toobtubb-guide"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22221

[services.development]
run = "pnpm --filter @workspace/toobtubb-guide run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/toobtubb-guide", "run", "build" ]
publicDir = "artifacts/toobtubb-guide/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22221"
BASE_PATH = "/"
